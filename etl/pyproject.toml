[project]
name = "etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mithun", email = "116871732+Mithun-750@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "boto3>=1.43.127",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "snowflake-connector-python>=5.2.0",
]

[project.scripts]
sla-etl = "sync:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["sync"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
